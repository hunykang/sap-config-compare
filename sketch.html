<style>
.sketch-card { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 14px 16px; margin: 10px 0; }
.sketch-card h4 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.sketch-card h4 a { color: inherit; text-decoration: none; }
.sketch-card h4 a:hover { text-decoration: underline; }
.sketch-card .cmt { font-size: 13.5px; color: #334155; margin: 6px 0 8px; }
.sketch-card .rel-line { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.sketch-card .rel-line a { color: var(--pce); text-decoration: none; }
.sketch-card .rel-line a:hover { text-decoration: underline; }
.sketch-card .go { font-size: 12px; color: var(--muted); white-space: nowrap; margin-left: 8px; }
.src-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #f1f5f9; color: var(--muted); margin-left: 8px; vertical-align: middle; }
.src-badge.nolink { background: transparent; color: #c3ccd8; border: 1px dashed #e5eaf1; }
.src-badge.link { text-decoration: none; cursor: pointer; }
.src-badge.date { background: transparent; color: #94a3b8; font-size: 11px; }
.area-group { margin: 0 0 8px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.area-head { width: 100%; text-align: left; padding: 13px 16px; font-size: 15px; font-weight: 700; background: var(--card); border: 0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.area-head .n { font-size: 12px; color: var(--muted); font-weight: 400; }
.area-head .arrow { color: var(--muted); font-size: 12px; margin-left: 8px; transition: transform .15s; }
.area-group.open .area-head .arrow { transform: rotate(180deg); }
.area-items { display: none; padding: 2px 12px 8px; }
.area-group.open .area-items { display: block; }
.sketch-card { margin: 10px 0; }
</style>

<main class="wrap">
  <h2 class="section">프로젝트 현장 스케치</h2>
  <p class="lead">살며 삽질하며.. 그날의 기록들</p>
  <div class="searchbar" style="margin:12px 0 10px">
    <input id="sq" type="search" placeholder="스케치 검색 (예: 부분반제, 연결회계, BSEG)" aria-label="스케치 검색">
  </div>
  <div class="rel-chips" id="cat-chips" style="margin:0 0 16px"></div>
  <div id="sketch-sections"></div>
  <script>
  (function () {
    function esc(x) { return String(x == null ? '' : x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    const cfgName = id => { const e = (typeof GUIDE_DATA !== 'undefined' ? GUIDE_DATA : []).find(x => x.id === id); return e ? e.item : id; };
    const termName = id => { const t = (typeof GLOSSARY !== 'undefined' ? GLOSSARY : []).find(x => x.id === id); return t ? t.kr : id; };
    const srcLabel = { blog: '블로그', facebook: '페이스북', evernote: '에버노트', keep: 'Keep' };
    const ORDER = ['결산·마감', '전표·전기', '원가·자재', '마스터·조직', 'MM·SD 연계', '회계 일반'];
    const byCat = {};
    SKETCHES.forEach(s => { (byCat[s.category || '회계 일반'] = byCat[s.category || '회계 일반'] || []).push(s); });
    function card(s) {
      const badge = s.url
        ? `<span class="src-badge">${srcLabel[s.source] || s.source}</span>`
        : `<span class="src-badge nolink">${srcLabel[s.source] || s.source}</span>`;
      const linkBadges = (s.links || []).map(l =>
        `<a class="src-badge link" href="${l.url}" target="_blank" rel="noopener">${srcLabel[l.type] || l.type}</a>`).join('');
      const dateBadge = s.date ? `<span class="src-badge date">${esc(s.date)}</span>` : '';
      const title = s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${esc(s.title)}</a>${s.source === 'blog' ? '<span class="go">블로그에서 읽기 ↗</span>' : ''}` : esc(s.title);
      const seen = new Set(); const rel = [];
      (s.configs || []).forEach(id => { const n = cfgName(id); if (!seen.has(n)) { seen.add(n); rel.push(`<a href="compare.html#row-${id}">${esc(n)}</a>`); } });
      (s.terms || []).forEach(id => { const n = termName(id); if (!seen.has(n)) { seen.add(n); rel.push(`<a href="glossary.html#term-${id}">${esc(n)}</a>`); } });
      const refs = (s.links || []).map(l =>
        `<a href="${l.url}" target="_blank" rel="noopener">${srcLabel[l.type] || l.type}${l.title ? ` '${esc(l.title)}'` : ''} ↗</a>`).join(' · ');
      return `<div class="sketch-card" id="sk-${s.id}">
        <h4>${title}${badge}${linkBadges}${dateBadge}</h4>
        ${s.comment ? `<p class="cmt">${esc(s.comment)}</p>` : ''}
        ${refs ? `<div class="rel-line">참고: ${refs}</div>` : ''}
        ${rel.length ? `<div class="rel-line">관련: ${rel.join(' · ')}</div>` : ''}
      </div>`;
    }
    const sectionsEl = document.getElementById('sketch-sections');
    const cats = ORDER.filter(cat => byCat[cat]);
    sectionsEl.innerHTML = cats.map((cat, idx) =>
      `<div class="area-group${idx === 0 ? ' open' : ''}" data-cat="${esc(cat)}">` +
      `<button class="area-head">${esc(cat)} <span><span class="n">· ${byCat[cat].length}</span><span class="arrow">▼</span></span></button>` +
      `<div class="area-items">${byCat[cat].map(card).join('')}</div></div>`
    ).join('') +
    `<div class="note" style="margin-top:28px">이 목록은 계속 엮어 나갑니다. 비교 가이드 항목과 연결되는 글을 추가 중입니다.</div>`;
    sectionsEl.addEventListener('click', ev => {
      const head = ev.target.closest('.area-head');
      if (head) head.closest('.area-group').classList.toggle('open');
    });
    // 검색 + 주제 칩 필터: 제목·요약·관련 칩 이름 기준, 매칭 그룹만 펼침
    const q = document.getElementById('sq');
    const chipsEl = document.getElementById('cat-chips');
    let activeCat = null;
    chipsEl.innerHTML = cats.map(cat => `<button data-cat="${esc(cat)}">${esc(cat)}</button>`).join('');
    function applyFilter() {
      const kw = q.value.trim().toLowerCase();
      sectionsEl.querySelectorAll('.area-group').forEach((g, idx) => {
        if (activeCat && g.dataset.cat !== activeCat) { g.style.display = 'none'; return; }
        if (!kw && !activeCat) {
          g.style.display = '';
          g.classList.toggle('open', idx === 0);
          g.querySelectorAll('.sketch-card').forEach(c => c.style.display = '');
          return;
        }
        let hit = 0;
        g.querySelectorAll('.sketch-card').forEach(c => {
          const ok = !kw || c.textContent.toLowerCase().includes(kw);
          c.style.display = ok ? '' : 'none';
          if (ok) hit++;
        });
        g.style.display = hit ? '' : 'none';
        g.classList.add('open');
      });
    }
    chipsEl.addEventListener('click', ev => {
      const b = ev.target.closest('button');
      if (!b) return;
      activeCat = (activeCat === b.dataset.cat) ? null : b.dataset.cat;
      chipsEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.cat === activeCat));
      applyFilter();
    });
    q.addEventListener('input', applyFilter);
    // 딥링킹: #sk-아이디 로 바로 열기 (용어집·비교표에서 넘어올 때)
    const initial = location.hash.replace('#', '');
    if (initial) {
      const cardEl = document.getElementById(CSS.escape(initial));
      if (cardEl) {
        cardEl.closest('.area-group').classList.add('open');
        setTimeout(() => cardEl.scrollIntoView({ block: 'center', behavior: 'smooth' }), 100);
      }
    }
  })();
  </script>
